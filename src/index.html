<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>COSC303 Mancala</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/circle.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Redaction+50:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="board">
        <!--Twelve elements for the twelve holes and two scoring regions -->
        <div id="scoreRegion1"></div>
        <div class="pcs" id="element1" onclick="num()"></div>
        <div class="pcs" id="element2" onclick="num2()"></div>
        <div class="pcs" id="element3" onclick="num3()"></div>
        <div class="pcs" id="element4"onclick="num4()"></div>
        <div class="pcs" id="element5"onclick="num5()"></div>
        <div class="pcs" id="element6"onclick="num6()"></div>
        <div id="element7"></div>
        <div id="element8"></div>
        <div id="element9"></div>
        <div id="element10"></div>
        <div id="element11"></div>
        <div id="element12"></div>
        <div id="scoreRegion2"></div>
    </div>
    <button id = "start" onclick="setTiles()">Start</button>
    <button id = "easy" onclick="eMode()" class="mode">Easy</button>
    <button id = "med" onclick="mMode()" class="mode">Medium</button>
    <button id = "diff" onclick="hMode()" class="mode">Difficult</button>
    <button id = "restart" onclick="window.location.reload()">Restart</button>
    <div id="win">
        <h1>RESULTS:</h1>
    </div>
    <script src="main.js"></script>
</body>
</html>
